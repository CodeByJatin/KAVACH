<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PNB Cybersecurity Hackathon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Rich Maroon to Gold Gradient */
            background: linear-gradient(135deg, #a31c3b 0%, #d97706 70%, #fef08a 100%);
            background-size: cover;
        }
        .heading-font { font-family: 'Outfit', sans-serif; }
        
        /* Faux Circuit Pattern Overlay */
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0);
            background-size: 32px 32px;
            pointer-events: none;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .pnb-badge {
            background: linear-gradient(135deg, #991b1b 0%, #ea580c 100%);
            border: 2px solid #facc15;
        }
    </style>
</head>
<body class="text-white min-h-screen flex relative overflow-hidden">
    <div class="bg-pattern"></div>
    
    <!-- Top Left Logos Placeholder -->
    <div class="absolute top-6 left-6 flex items-center space-x-4 bg-white/90 px-4 py-2 rounded-full shadow-lg z-20">
        <i class="fas fa-university text-rose-900 text-xl"></i>
        <div class="h-6 w-px bg-gray-300"></div>
        <span class="text-rose-900 font-bold tracking-tight">PNB</span>
    </div>

    <div class="container mx-auto px-4 lg:px-12 flex flex-col lg:flex-row items-center justify-between h-screen relative z-10 w-full">
        
        <!-- Left Side: Login Form -->
        <div class="w-full lg:w-1/3 flex justify-center lg:justify-start mb-12 lg:mb-0 mt-20 lg:mt-0 relative">
            
            <div class="glass-card p-10 rounded-2xl w-full max-w-md relative z-10">
                <div class="absolute -top-6 -right-6 h-16 w-16 pnb-badge rounded-full flex items-center justify-center font-bold text-xs shadow-xl rotate-12">
                    <div class="text-center leading-tight">PQC<br>Ready</div>
                </div>
                
                <h2 class="text-2xl font-bold mb-6 text-white text-center">Sign IN</h2>
                
                {% if error %}
                <div class="bg-red-500/80 border border-red-500 text-white px-4 py-3 rounded mb-6 text-sm text-center font-medium">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login" class="space-y-6">
                    <div>
                        <label class="block text-xs font-semibold text-rose-200 uppercase tracking-widest mb-2">Email / Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-white/50"><i class="fas fa-user"></i></span>
                            <input type="email" name="email" required 
                                class="w-full bg-white/10 border border-white/20 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:bg-white/20 transition-all placeholder-white/30" placeholder="officer@pnb.bank.in">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-rose-200 uppercase tracking-widest mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-white/50"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" required 
                                class="w-full bg-white/10 border border-white/20 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:bg-white/20 transition-all placeholder-white/30" placeholder="••••••••">
                        </div>
                    </div>
                    
                    <div class="flex justify-end">
                        <a href="#" class="text-xs text-yellow-300 hover:text-yellow-100 transition-colors">Forgot Password?</a>
                    </div>

                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 hover:from-yellow-400 hover:to-yellow-300 text-rose-900 font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(234,179,8,0.4)] hover:shadow-[0_0_25px_rgba(234,179,8,0.6)] hover:-translate-y-0.5 transition-all duration-200 text-lg uppercase tracking-wide">
                        Sign In
                    </button>
                    
                    <div class="text-center mt-4">
                        <a href="/register" class="text-xs text-white/70 hover:text-white transition-colors border-b border-white/30 pb-0.5">Register new account</a>
                    </div>
                </form>
            </div>
            
        </div>

        <!-- Right Side: Prototype Text Layout -->
        <div class="w-full lg:w-3/5 text-center lg:text-right flex flex-col justify-center items-center lg:items-end">
            <h1 class="heading-font text-5xl lg:text-7xl font-black text-white/90 drop-shadow-md tracking-tight mb-2">PSB HACKATHON SERIES</h1>
            <h3 class="text-xl lg:text-2xl text-yellow-300 font-medium mb-8">In collaboration with IIT Kanpur</h3>
            
            <h2 class="heading-font text-6xl lg:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-yellow-500 drop-shadow-[0_5px_5px_rgba(0,0,0,0.5)] mb-6" style="line-height: 1.1;">
                PNB Cybersecurity<br>Hackathon 2026
            </h2>
            
            <div class="flex items-center justify-end space-x-4 w-full">
                <div class="h-px bg-gradient-to-r from-transparent to-white/50 flex-grow max-w-xs"></div>
                <p class="text-2xl text-white font-light italic">Cyber Innovation Begins</p>
                <div class="h-px bg-gradient-to-l from-transparent to-white/50 flex-grow max-w-xs"></div>
            </div>
        </div>

    </div>
</body>
</html>
