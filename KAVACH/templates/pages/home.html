<!-- Dashboard Home -->
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
    <!-- Stats Cards -->
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 relative overflow-hidden group hover:scale-[1.02] transition-transform">
        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
            <i class="fas fa-globe text-6xl text-blue-400"></i>
        </div>
        <h3 class="text-slate-400 text-sm font-medium">Monitored Domains</h3>
        <p class="text-4xl font-bold text-white mt-2" id="statDomains">-</p>
    </div>
    
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 relative overflow-hidden group hover:scale-[1.02] transition-transform">
        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
            <i class="fas fa-server text-6xl text-purple-400"></i>
        </div>
        <h3 class="text-slate-400 text-sm font-medium">Public Assets Scanned</h3>
        <p class="text-4xl font-bold text-white mt-2" id="statAssets">-</p>
    </div>
    
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 relative overflow-hidden group hover:scale-[1.02] transition-transform">
        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
            <i class="fas fa-shield-alt text-6xl text-green-400"></i>
        </div>
        <h3 class="text-slate-400 text-sm font-medium">Elite-PQC Assets</h3>
        <p class="text-4xl font-bold text-green-400 mt-2" id="statElite">-</p>
    </div>
    
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 relative overflow-hidden group hover:scale-[1.02] transition-transform">
        <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
            <i class="fas fa-exclamation-triangle text-6xl text-red-500"></i>
        </div>
        <h3 class="text-slate-400 text-sm font-medium">Critical Risks</h3>
        <p class="text-4xl font-bold text-red-500 mt-2" id="statCritical">-</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
    <!-- Chart: Asset Type Distribution -->
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 flex flex-col h-[22rem]">
        <h3 class="text-lg font-medium mb-4 text-slate-200">Asset Type Distribution</h3>
        <div class="flex-1 w-full relative">
            <canvas id="chartTypeDist"></canvas>
        </div>
    </div>
    
    <!-- Chart: Asset Risk Distribution -->
    <div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 flex flex-col h-[22rem]">
        <h3 class="text-lg font-medium mb-4 text-slate-200">Asset Risk Distribution</h3>
        <div class="flex-1 w-full relative">
            <canvas id="chartRiskDist"></canvas>
        </div>
    </div>
</div>

<!-- Network Geography Map -->
<div class="glass-panel rounded-xl p-6 shadow-lg border border-yellow-500/20 mb-8">
    <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-medium text-slate-200"><i class="fas fa-map-marked-alt mr-2 text-yellow-500"></i>Network Geography</h3>
        <span class="text-xs text-slate-500">IP locations based on discovered assets</span>
    </div>
    <div id="dashboardMap" class="w-full rounded-lg overflow-hidden" style="height: 340px; background: #1e293b;"></div>
</div>

<!-- Cryptographic Assets Mini-Table -->
<div class="glass-panel rounded-xl border border-yellow-500/20 overflow-hidden shadow-lg">
    <div class="px-6 py-4 border-b border-slate-700/50 flex items-center justify-between">
        <h3 class="text-lg font-medium text-slate-200"><i class="fas fa-list-alt mr-2 text-yellow-500"></i>Cryptographic Assets by Subdomain</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
            <thead class="text-xs uppercase bg-gradient-to-r from-yellow-600 to-yellow-500 text-rose-950 font-bold">
                <tr>
                    <th class="px-6 py-3">Subdomain</th>
                    <th class="px-6 py-3">Open Ports</th>
                    <th class="px-6 py-3">TLS</th>
                    <th class="px-6 py-3">Score</th>
                    <th class="px-6 py-3">Status</th>
                </tr>
            </thead>
            <tbody id="dashMiniTableBody" class="divide-y divide-slate-700/50">
                <!-- JS populated -->
            </tbody>
        </table>
    </div>
</div>
