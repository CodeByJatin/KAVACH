<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAVACH - Add Domain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        .filter-btn.active {
            background-color: #1e293b;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex" style="background-color: #f8fafc;">
    <aside class="w-64 min-h-screen flex flex-col" style="background-color: #1e293b;">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-white">KAVACH</h1>
            <p class="text-sm text-gray-400 mt-1">Quantum Security Monitor</p>
        </div>
        <div class="border-t border-gray-700 my-2"></div>
        <nav class="flex-1 px-4 py-2 space-y-1">
            <a href="/" class="block px-4 py-2 rounded text-gray-300 hover:bg-gray-700 hover:text-white">🏠 Dashboard</a>
            <a href="/add-domain" class="block px-4 py-2 rounded text-white bg-gray-700">➕ Add Domain</a>
            <a href="/discovery" class="block px-4 py-2 rounded text-gray-300 hover:bg-gray-700 hover:text-white">🔍 Discovery</a>
        </nav>
        <div class="border-t border-gray-700 my-2"></div>
        <div class="px-4 py-2">
            <p class="text-xs text-gray-500 uppercase mb-2 px-4">My Domains</p>
            <div id="domains-list" class="max-h-48 overflow-y-auto mb-3"></div>
        </div>
        <div class="p-4 mt-auto">
            <form action="/logout" method="POST">
                <button type="submit" class="w-full px-4 py-2 rounded text-gray-300 hover:bg-gray-700 text-left">Logout</button>
            </form>
        </div>
    </aside>

    <div class="flex-1 p-8">
        <h2 class="text-2xl font-bold mb-6" style="color: #1e293b;">Add Domain for Scanning</h2>

        <div id="state1-input" class="max-w-xl">
            <div class="bg-white rounded-lg shadow-lg p-6" style="border-top: 4px solid #1e293b;">
                <div id="existing-notice" class="hidden mb-4 p-3 bg-blue-50 border border-blue-200 rounded text-blue-700 text-sm">
                    <strong>Domain already exists!</strong> Fresh subdomain discovery will be performed.
                </div>
                <label class="block text-gray-700 text-sm font-medium mb-2">Domain Name</label>
                <input type="text" id="domain-input" 
                       class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-gray-500 mb-4"
                       placeholder="example.com">
                <button id="discover-btn" onclick="discoverSubdomains()"
                        class="w-full py-2 px-4 rounded text-white font-medium"
                        style="background-color: #1e293b;">
                    Discover Subdomains
                </button>
                <div id="loading-spinner" class="hidden text-center mt-4">
                    <div class="inline-block w-8 h-8 border-4 border-gray-300 border-t-gray-600 rounded-full animate-spin"></div>
                    <p class="mt-2 text-gray-600">Discovering subdomains...</p>
                </div>
            </div>
        </div>

        <div id="state2-selection" class="hidden max-w-3xl">
            <div class="bg-white rounded-lg shadow-lg p-6" style="border-top: 4px solid #1e293b;">
                <div id="domain-info" class="mb-4 p-3 bg-gray-50 rounded border-l-4" style="border-color: #1e293b;">
                    <h3 id="domain-name-display" class="font-semibold" style="color: #1e293b;"></h3>
                    <p id="domain-meta" class="text-sm text-gray-500 mt-1"></p>
                </div>
                
                <div class="flex gap-2 mb-4">
                    <button onclick="setFilter('all')" class="filter-btn active px-4 py-2 rounded text-sm font-medium border border-gray-300" data-filter="all">All</button>
                    <button onclick="setFilter('scanned')" class="filter-btn px-4 py-2 rounded text-sm font-medium border border-gray-300" data-filter="scanned">Already Scanned</button>
                    <button onclick="setFilter('not-scanned')" class="filter-btn px-4 py-2 rounded text-sm font-medium border border-gray-300" data-filter="not-scanned">Never Scanned</button>
                </div>

                <div class="flex gap-4 mb-4">
                    <button onclick="selectAll()" 
                            class="px-4 py-2 rounded text-sm font-medium"
                            style="background-color: #1e293b; color: white;">
                        Select All
                    </button>
                    <button onclick="selectNone()" 
                            class="px-4 py-2 rounded text-sm font-medium border border-gray-300 text-gray-700">
                        Select None
                    </button>
                    <button onclick="selectNotScanned()" 
                            class="px-4 py-2 rounded text-sm font-medium border border-gray-300 text-gray-700">
                        Select Not Scanned Only
                    </button>
                </div>

                <div id="subdomains-list" class="max-h-96 overflow-y-auto border border-gray-200 rounded p-4 mb-4 space-y-2">
                </div>

                <div class="flex justify-between items-center mb-4">
                    <p id="selected-counter" class="text-gray-600">Selected: 0</p>
                    <p id="estimated-time" class="text-gray-600">Estimated time: 0 minutes</p>
                </div>

                <button id="start-scan-btn" onclick="startDeepScan()" disabled
                        class="w-full py-2 px-4 rounded text-white font-medium disabled:opacity-50 disabled:cursor-not-allowed"
                        style="background-color: #1e293b;">
                    Start Deep Scan
                </button>

                <button onclick="goBack()" class="mt-4 w-full py-2 px-4 rounded border border-gray-300 text-gray-700 font-medium">
                    Back
                </button>
            </div>
        </div>

        <div id="state3-progress" class="hidden max-w-3xl">
            <div class="bg-white rounded-lg shadow-lg p-6" style="border-top: 4px solid #1e293b;">
                <h3 id="scanning-title" class="text-lg font-semibold mb-4" style="color: #1e293b;"></h3>
                
                <div class="mb-4">
                    <div class="flex justify-between text-sm text-gray-600 mb-1">
                        <span>Progress</span>
                        <span id="progress-text">0 of 0 complete</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-4">
                        <div id="progress-bar" class="h-4 rounded-full transition-all duration-300" style="background-color: #1e293b; width: 0%;"></div>
                    </div>
                </div>

                <div id="scan-status-list" class="max-h-96 overflow-y-auto border border-gray-200 rounded p-4 space-y-2">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentDomain = '';
        let currentDomainId = null;
        let isExisting = false;
        let subdomains = [];
        let filteredSubdomains = [];
        let selectedSubdomains = new Set();
        let currentFilter = 'all';
        let pollInterval = null;

        async function loadDomains() {
            try {
                const response = await fetch('/api/my-domains');
                const domains = await response.json();
                const list = document.getElementById('domains-list');
                list.innerHTML = `
                    <a href="/" 
                       class="block px-4 py-2 rounded text-sm text-gray-300 hover:bg-gray-700 hover:text-white mb-1">
                        ★ All Domains
                    </a>
                ` + (domains.map(d => `
                    <a href="/discovery?domain=${d.id}" 
                       class="block px-4 py-2 rounded text-sm text-gray-300 hover:bg-gray-700 hover:text-white mb-1">
                        ● ${d.domain_name}
                        <span class="text-xs text-gray-500 block">${d.asset_count || 0} assets</span>
                    </a>
                `).join('') || '<p class="px-4 text-gray-500 text-sm">No domains yet</p>');
            } catch (error) {
                console.error('Error loading domains:', error);
            }
        }

        async function discoverSubdomains() {
            const domain = document.getElementById('domain-input').value.trim();
            if (!domain) return;

            currentDomain = domain;
            document.getElementById('discover-btn').disabled = true;
            document.getElementById('loading-spinner').classList.remove('hidden');
            document.getElementById('existing-notice').classList.add('hidden');

            try {
                const response = await fetch('/api/discover', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ domain: domain })
                });
                const data = await response.json();
                
                currentDomainId = data.domain_id;
                isExisting = data.is_existing;
                subdomains = data.subdomains || [];
                
                if (isExisting) {
                    document.getElementById('existing-notice').classList.remove('hidden');
                }
                
                filteredSubdomains = [...subdomains];
                renderSubdomains();
                switchToState2();
            } catch (error) {
                alert('Error discovering subdomains: ' + error.message);
            } finally {
                document.getElementById('discover-btn').disabled = false;
                document.getElementById('loading-spinner').classList.add('hidden');
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.filter === filter) {
                    btn.classList.add('active');
                }
            });
            applyFilter();
        }

        function applyFilter() {
            if (currentFilter === 'all') {
                filteredSubdomains = [...subdomains];
            } else if (currentFilter === 'scanned') {
                filteredSubdomains = subdomains.filter(s => s.already_scanned);
            } else if (currentFilter === 'not-scanned') {
                filteredSubdomains = subdomains.filter(s => !s.already_scanned);
            }
            renderSubdomains();
        }

        function renderSubdomains() {
            const list = document.getElementById('subdomains-list');
            const scannedCount = subdomains.filter(s => s.already_scanned).length;
            const notScannedCount = subdomains.length - scannedCount;
            
            document.getElementById('domain-name-display').textContent = currentDomain;
            document.getElementById('domain-meta').textContent = 
                `${subdomains.length} subdomains found | ${scannedCount} scanned | ${notScannedCount} not scanned`;
            
            list.innerHTML = filteredSubdomains.map(sub => {
                const isScanned = sub.already_scanned;
                const statusIcon = isScanned 
                    ? '<span class="text-green-500">✓</span>' 
                    : '<span class="text-gray-400">○</span>';
                const statusText = isScanned 
                    ? `<span class="text-green-600 text-sm ml-2">Scanned ${sub.last_scanned ? new Date(sub.last_scanned).toLocaleDateString() : ''}</span>`
                    : '<span class="text-gray-400 text-sm ml-2">Not scanned</span>';
                
                return `
                    <label class="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded cursor-pointer">
                        <input type="checkbox" value="${sub.subdomain}" data-scanned="${isScanned}" onchange="updateSelection()" 
                               class="w-4 h-4 rounded border-gray-300">
                        ${statusIcon}
                        <span class="text-gray-700 flex-1">${sub.subdomain}</span>
                        ${statusText}
                    </label>
                `;
            }).join('');
            
            updateSelection();
        }

        function updateSelection() {
            const checkboxes = document.querySelectorAll('#subdomains-list input[type="checkbox"]');
            selectedSubdomains = new Set();
            
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    selectedSubdomains.add(cb.value);
                }
            });

            const count = selectedSubdomains.size;
            const estimatedMinutes = (count * 15 / 60).toFixed(1);
            
            document.getElementById('selected-counter').textContent = `Selected: ${count}`;
            document.getElementById('estimated-time').textContent = `Estimated time: ${estimatedMinutes} minutes`;
            
            const startBtn = document.getElementById('start-scan-btn');
            startBtn.disabled = count === 0;
        }

        function selectAll() {
            document.querySelectorAll('#subdomains-list input[type="checkbox"]').forEach(cb => cb.checked = true);
            updateSelection();
        }

        function selectNone() {
            document.querySelectorAll('#subdomains-list input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateSelection();
        }

        function selectNotScanned() {
            document.querySelectorAll('#subdomains-list input[type="checkbox"]').forEach(cb => {
                cb.checked = cb.dataset.scanned === 'false';
            });
            updateSelection();
        }

        function switchToState2() {
            document.getElementById('state1-input').classList.add('hidden');
            document.getElementById('state2-selection').classList.remove('hidden');
            document.getElementById('state3-progress').classList.add('hidden');
        }

        function goBack() {
            document.getElementById('state2-selection').classList.add('hidden');
            document.getElementById('state1-input').classList.remove('hidden');
            document.getElementById('existing-notice').classList.add('hidden');
            subdomains = [];
            selectedSubdomains.clear();
            document.getElementById('domain-input').value = '';
        }

        async function startDeepScan() {
            const selected = Array.from(selectedSubdomains);
            
            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        domain_id: currentDomainId,
                        selected_subdomains: selected
                    })
                });
                const data = await response.json();
                
                initializeScanStatus(selected);
                switchToState3();
                startPolling();
            } catch (error) {
                alert('Error starting scan: ' + error.message);
            }
        }

        function initializeScanStatus(subdomains) {
            const list = document.getElementById('scan-status-list');
            document.getElementById('scanning-title').textContent = `Scanning ${currentDomain}`;
            document.getElementById('progress-text').textContent = `0 of ${subdomains.length} scanning...`;
            document.getElementById('progress-bar').style.width = '0%';
            
            list.innerHTML = subdomains.map(sub => `
                <div id="status-${sub.replace(/\./g, '-')}" class="flex items-center space-x-3 p-2">
                    <span id="icon-${sub.replace(/\./g, '-')}" class="text-yellow-500 animate-spin">⟳</span>
                    <span class="text-gray-700">${sub}</span>
                    <span id="text-${sub.replace(/\./g, '-')}" class="text-yellow-500 text-sm ml-auto">Scanning...</span>
                </div>
            `).join('');
        }

        function switchToState3() {
            document.getElementById('state1-input').classList.add('hidden');
            document.getElementById('state2-selection').classList.add('hidden');
            document.getElementById('state3-progress').classList.remove('hidden');
        }

        async function pollProgress() {
            if (!currentDomainId) return;

            try {
                const response = await fetch(`/api/scan/progress/${currentDomainId}`);
                const data = await response.json();

                const completed = data.completed;
                const total = data.total;
                const status = data.status;

                const progressPercent = total > 0 ? (completed / total) * 100 : 0;
                document.getElementById('progress-bar').style.width = `${progressPercent}%`;
                document.getElementById('progress-text').textContent = `${completed} of ${total} ${status === 'completed' ? 'complete' : 'scanning...'}`;

                if (completed > 0) {
                    const scannedSubs = subdomains.slice(0, completed);
                    scannedSubs.forEach((sub, index) => {
                        const id = sub.replace(/\./g, '-');
                        const icon = document.getElementById(`icon-${id}`);
                        const text = document.getElementById(`text-${id}`);
                        if (icon && text) {
                            icon.textContent = '✓';
                            icon.className = 'text-green-500';
                            icon.style.animation = 'none';
                            text.textContent = 'Done';
                            text.className = 'text-green-500 text-sm ml-auto';
                        }
                    });
                }

                if (status === 'completed') {
                    stopPolling();
                    setTimeout(() => {
                        window.location.href = '/discovery?domain=' + currentDomainId;
                    }, 1500);
                }
            } catch (error) {
                console.error('Poll error:', error);
            }
        }

        function startPolling() {
            pollProgress();
            pollInterval = setInterval(pollProgress, 2000);
        }

        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadDomains();
        });
    </script>
</body>
</html>
