<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAVACH - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex" style="background-color: #f8fafc;">
    <div class="w-full flex items-center justify-center px-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold mb-2" style="color: #1e293b;">KAVACH</h1>
                <p class="text-gray-600">Quantum Security Monitoring Platform</p>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-8" style="border-top: 4px solid #1e293b;">
                {% if error %}
                <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-medium mb-2">Email</label>
                        <input type="email" name="email" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-gray-500"
                               placeholder="Enter your email">
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-medium mb-2">Password</label>
                        <input type="password" name="password" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-gray-500"
                               placeholder="Enter your password">
                    </div>

                    <button type="submit" 
                            class="w-full py-2 px-4 rounded text-white font-medium"
                            style="background-color: #1e293b;">
                        Login
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-gray-600 text-sm">
                        Don't have an account? 
                        <a href="/register" class="font-medium" style="color: #1e293b;">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
